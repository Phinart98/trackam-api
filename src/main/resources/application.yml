server:
  port: 8080

spring:
  datasource:
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/trackam}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Spring AI — Groq is primary (auto-configured via spring.ai.openai.*)
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: meta-llama/llama-4-scout-17b-16e-instruct
      embedding:
        enabled: false
    # Disable Spring AI's built-in retry — we handle fallback ourselves in AiService
    retry:
      max-attempts: 1
      on-client-errors: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

trackam:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    project-url: ${SUPABASE_URL:}
  admin:
    user-id: ${TRACKAM_ADMIN_USER_ID:}
  ai:
    max-daily-calls: 500
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      text-model: gemini-2.5-flash-lite
      complex-model: gemini-2.5-flash
      embedding-model: text-embedding-004
    provider-routing:
      vision: groq
      text: gemini-lite
      complex: gemini-flash
    fallback-order: groq,gemini-lite,gemini-flash

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
