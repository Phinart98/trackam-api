server:
  port: 8080

spring:
  datasource:
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/trackam?prepareThreshold=0}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: TrackAmPool
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Spring AI — Groq is primary (auto-configured via spring.ai.openai.*)
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: meta-llama/llama-4-scout-17b-16e-instruct
      audio:
        transcription:
          options:
            model: whisper-large-v3-turbo
      embedding:
        enabled: false
    # Disable Spring AI's built-in retry — we handle fallback ourselves in AiService
    retry:
      max-attempts: 1
      on-client-errors: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

trackam:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  supabase:
    project-url: ${SUPABASE_URL:}
  admin:
    user-id: ${TRACKAM_ADMIN_USER_ID:}
  exchange:
    base-url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api
  ai:
    max-daily-calls: 500
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      text-model: gemini-2.5-flash-lite
      complex-model: gemini-2.5-flash
      embedding-model: gemini-embedding-001
    cerebras:
      api-key: ${CEREBRAS_API_KEY:}
      base-url: https://api.cerebras.ai/v1
      model: gpt-oss-120b
    # Provider routing and fallback order are hardcoded in AiService — deliberately not
    # config-driven, so the chain order is visible at the call site next to its rationale.

logging:
  level:
    root: WARN
    com.trackam: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
